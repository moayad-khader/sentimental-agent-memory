<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMG Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #161b27;
      border-bottom: 1px solid #1e2535;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #94a3b8; letter-spacing: .04em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .dot.off { background: #ef4444; }

    /* ── Memory toggle ── */
    .memory-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 16px;
    }
    .memory-toggle label {
      font-size: 12px;
      color: #64748b;
      user-select: none;
      cursor: pointer;
    }
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2d3748;
      border-radius: 10px;
      transition: background .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #6366f1; }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); }

    .identity {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .identity input {
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #e2e8f0;
      width: 130px;
      outline: none;
    }
    .identity input:focus { border-color: #6366f1; }
    .identity input::placeholder { color: #4a5568; }

    /* ── Main layout ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat panel ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      border-right: 1px solid #1e2535;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 78%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .avatar { background: #6366f1; color: #fff; }
    .msg.agent .avatar { background: #1e2535; color: #94a3b8; border: 1px solid #2d3748; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
    .msg.agent .bubble { background: #1a2035; color: #cbd5e1; border: 1px solid #1e2535; border-bottom-left-radius: 4px; }

    .thinking .bubble { color: #4a5568; font-style: italic; }
    .thinking .bubble::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a5568;
      margin-left: 6px;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100% { opacity:.2 } 50% { opacity:1 } }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid #1e2535;
      background: #0f1117;
    }
    .input-row textarea {
      flex: 1;
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #e2e8f0;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-row textarea:focus { border-color: #6366f1; }
    .input-row textarea::placeholder { color: #4a5568; }
    .send-btn {
      background: #6366f1;
      border: none;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background .15s;
    }
    .send-btn:hover { background: #4f52d4; }
    .send-btn:disabled { background: #2d3748; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: #fff; }

    /* ── Memory panel ── */
    .memory-panel {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .memory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #1e2535;
      flex-shrink: 0;
    }
    .memory-header span { font-size: 12px; font-weight: 600; color: #64748b; letter-spacing: .06em; text-transform: uppercase; }
    .refresh-btn {
      background: transparent;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #64748b;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .refresh-btn:hover { border-color: #6366f1; color: #6366f1; }

    .memory-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .memory-body::-webkit-scrollbar { width: 4px; }
    .memory-body::-webkit-scrollbar-track { background: transparent; }
    .memory-body::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }

    .section {
      background: #161b27;
      border: 1px solid #1e2535;
      border-radius: 8px;
      overflow: hidden;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
      user-select: none;
      background: #1a2035;
    }
    .section-title:hover { color: #94a3b8; }
    .section-title .count {
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 600;
    }
    .section-items { display: flex; flex-direction: column; gap: 1px; }
    .section.collapsed .section-items { display: none; }

    .mem-item {
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.5;
      border-top: 1px solid #1e2535;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .mem-item .name { font-weight: 600; color: #cbd5e1; }
    .mem-item .meta { color: #64748b; display: flex; flex-wrap: wrap; gap: 6px; }
    .mem-item .reason { color: #94a3b8; font-style: italic; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .pill.positive { background: #14532d; color: #86efac; }
    .pill.negative { background: #450a0a; color: #fca5a5; }
    .pill.neutral  { background: #1e2535; color: #94a3b8; }
    .pill.emotion  { background: #1e1b4b; color: #a5b4fc; }
    .pill.relation { background: #1c1917; color: #a8a29e; }

    .conf-bar {
      height: 3px;
      background: #1e2535;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .conf-fill { height: 100%; background: #6366f1; border-radius: 2px; }

    .empty { padding: 12px; font-size: 12px; color: #4a5568; text-align: center; }

    .episode-entities {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }
    .entity-tag {
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<header>
  <div class="dot off" id="statusDot"></div>
  <h1>SMG Agent</h1>
  <div class="memory-toggle">
    <label class="toggle-switch" for="memoryToggle" title="Toggle sentimental memory">
      <input type="checkbox" id="memoryToggle" checked />
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
    <label for="memoryToggle" id="memoryToggleLabel" style="color:#a5b4fc;font-size:12px;cursor:pointer">Memory on</label>
  </div>
  <div class="identity">
    <input id="userId" placeholder="user id" value="mo" />
    <input id="userName" placeholder="user name" value="Moayad" />
  </div>
</header>

<main>
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="msg agent">
        <div class="avatar">AI</div>
        <div class="bubble">Hey! I remember everything we talk about. What's on your mind?</div>
      </div>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="memory-panel">
    <div class="memory-header">
      <span>Memory</span>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="memory-body" id="memoryBody">
      <div class="empty">Send a message to see memory.</div>
    </div>
  </div>
</main>

<script>
  const API = "http://localhost:3000";

  const messagesEl      = document.getElementById("messages");
  const inputEl         = document.getElementById("input");
  const sendBtn         = document.getElementById("sendBtn");
  const refreshBtn      = document.getElementById("refreshBtn");
  const memoryBody      = document.getElementById("memoryBody");
  const statusDot       = document.getElementById("statusDot");
  const memoryToggle    = document.getElementById("memoryToggle");
  const memoryToggleLabel = document.getElementById("memoryToggleLabel");
  const memoryPanel     = document.querySelector(".memory-panel");

  // ── Helpers ──────────────────────────────────────────────────────────────

  function userId()    { return document.getElementById("userId").value.trim(); }
  function userName()  { return document.getElementById("userName").value.trim(); }
  function useMemory() { return memoryToggle.checked; }

  function applyMemoryToggle() {
    const on = useMemory();
    memoryPanel.style.display = on ? "" : "none";
    memoryToggleLabel.textContent = on ? "Memory on" : "Memory off";
    memoryToggleLabel.style.color = on ? "#a5b4fc" : "#64748b";
  }

  memoryToggle.addEventListener("change", applyMemoryToggle);
  applyMemoryToggle();

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    const initials = role === "user" ? (userName()[0] || "U").toUpperCase() : "AI";
    msg.innerHTML = `<div class="avatar">${initials}</div><div class="bubble">${escHtml(text)}</div>`;
    messagesEl.appendChild(msg);
    scrollBottom();
    return msg;
  }

  function addThinking() {
    const msg = document.createElement("div");
    msg.className = "msg agent thinking";
    msg.innerHTML = `<div class="avatar">AI</div><div class="bubble">Thinking</div>`;
    messagesEl.appendChild(msg);
    scrollBottom();
    return msg;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function pill(text, type) {
    return `<span class="pill ${type}">${escHtml(text)}</span>`;
  }

  function confBar(c) {
    return `<div class="conf-bar"><div class="conf-fill" style="width:${Math.round(c*100)}%"></div></div>`;
  }

  // ── Ping server ──────────────────────────────────────────────────────────

  async function ping() {
    try {
      await fetch(`${API}/memory/ping`, { signal: AbortSignal.timeout(1500) });
    } catch (_) {}
    try {
      const r = await fetch(`${API}/memory/__ping__`, { signal: AbortSignal.timeout(1500) });
      statusDot.classList.toggle("off", false);
    } catch (_) {
      // try any known route to check connectivity
      try {
        const r2 = await fetch(`${API}/memory/test`, { signal: AbortSignal.timeout(1500) });
        statusDot.classList.remove("off");
      } catch (_2) {
        statusDot.classList.add("off");
      }
    }
  }

  // ── Chat ─────────────────────────────────────────────────────────────────

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message || !userId() || !userName()) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", message);
    const thinking = addThinking();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: userId(), userName: userName(), message, useMemory: useMemory() }),
      });

      thinking.remove();

      if (!res.ok) {
        const err = await res.text();
        addMessage("agent", `Error ${res.status}: ${err}`);
      } else {
        const data = await res.json();
        addMessage("agent", data.response);
        statusDot.classList.remove("off");
        if (useMemory()) await loadMemory();
      }
    } catch (e) {
      thinking.remove();
      addMessage("agent", `Could not reach server: ${e.message}`);
      statusDot.classList.add("off");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Memory ───────────────────────────────────────────────────────────────

  async function loadMemory() {
    const uid = userId();
    if (!uid) return;
    try {
      const res = await fetch(`${API}/memory/${encodeURIComponent(uid)}`);
      if (!res.ok) return;
      const data = await res.json();
      renderMemory(data);
    } catch (_) {}
  }

  function renderMemory(m) {
    const sections = [
      renderSentiments(m.sentiments || []),
      renderFacts(m.facts || []),
      renderPreferences(m.preferences || []),
      renderEpisodes(m.episodes || []),
      renderAssociations(m.associations || []),
    ];
    memoryBody.innerHTML = sections.join("");

    // collapse toggles
    memoryBody.querySelectorAll(".section-title").forEach(title => {
      title.addEventListener("click", () => {
        title.closest(".section").classList.toggle("collapsed");
      });
    });
  }

  function section(title, countNum, items) {
    const itemsHtml = items.length === 0
      ? `<div class="empty">none</div>`
      : `<div class="section-items">${items.join("")}</div>`;
    return `
      <div class="section">
        <div class="section-title">
          ${escHtml(title)}
          <span class="count">${countNum}</span>
        </div>
        ${itemsHtml}
      </div>`;
  }

  function renderSentiments(list) {
    const items = list.map(s => {
      const valence = s.sentiment === "positive" ? "positive" : s.sentiment === "negative" ? "negative" : "neutral";
      return `<div class="mem-item">
        <div class="name">${escHtml(s.entityName)} <span style="color:#64748b;font-weight:400;font-size:11px">${escHtml(s.entityType)}</span></div>
        <div class="meta">${pill(s.sentiment, valence)} ${pill(s.emotion, "emotion")}</div>
        <div class="reason">${escHtml(s.reason)}</div>
        ${confBar(s.confidence)}
      </div>`;
    });
    return section("Sentiments", list.length, items);
  }

  function renderFacts(list) {
    const items = list.map(f => `<div class="mem-item">
      <div class="name">${escHtml(f.entityName)}</div>
      <div class="meta">${pill(f.relation, "relation")}</div>
      ${confBar(f.confidence)}
    </div>`);
    return section("Facts", list.length, items);
  }

  function renderPreferences(list) {
    const items = list.map(p => {
      const pol = p.polarity === "likes" || p.polarity === "positive" ? "positive" : "negative";
      return `<div class="mem-item">
        <div class="name">${escHtml(p.entityName)}</div>
        <div class="meta">${pill(p.polarity, pol)}</div>
        <div class="reason">${escHtml(p.reason)}</div>
        ${confBar(p.confidence)}
      </div>`;
    });
    return section("Preferences", list.length, items);
  }

  function renderEpisodes(list) {
    const items = list.map(ep => {
      const ts = new Date(ep.timestamp).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
      const tags = ep.entities.map(e => `<span class="entity-tag">${escHtml(e.name)}</span>`).join("");
      return `<div class="mem-item">
        <div class="meta"><span>${ts}</span> ${pill(ep.source, "neutral")}</div>
        <div class="episode-entities">${tags || '<span style="color:#4a5568">no entities</span>'}</div>
      </div>`;
    });
    return section("Episodes", list.length, items);
  }

  function renderAssociations(list) {
    const items = list.map(a => `<div class="mem-item">
      <div class="name">${escHtml(a.entityAName)} <span style="color:#4a5568">↔</span> ${escHtml(a.entityBName)}</div>
      <div class="meta"><span>seen ${a.observedCount}×</span></div>
      ${confBar(a.weight)}
    </div>`);
    return section("Associations", list.length, items);
  }

  // ── Events ───────────────────────────────────────────────────────────────

  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  refreshBtn.addEventListener("click", loadMemory);

  // userId change → reload memory
  document.getElementById("userId").addEventListener("change", loadMemory);

  // ── Init ─────────────────────────────────────────────────────────────────

  ping();
  loadMemory();
</script>
</body>
</html>
